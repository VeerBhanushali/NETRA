<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NETRA">
  <!-- NETRA means "eye" in Sanskrit. The mark is that taken literally: a
       camera aperture whose blades enclose a lens iris. Monoline and
       geometric so it survives 16px in a tab and 1-colour print. -->
  <title>NETRA</title>
  <circle cx="32" cy="32" r="25.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <path d="M32 13.4 L48.1 22.7 L48.1 41.3 L32 50.6 L15.9 41.3 L15.9 22.7 Z"
        fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="9.6" fill="none" stroke="currentColor" stroke-width="2.6"/>
  <circle cx="32" cy="32" r="4" fill="currentColor"/>
</svg>
